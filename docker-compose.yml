services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s

  ingestion_service:
    build:
      context: .
      dockerfile: services/ingestion_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - VECTOR_INDEX_PATH=/shared/index
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - vector-index:/shared
    depends_on:
      kafka:
        condition: service_healthy

  analysis_service:
    build:
      context: .
      dockerfile: services/analysis_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VECTOR_INDEX_PATH=/shared/index
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MOCK_LLM=${MOCK_LLM:-false}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - vector-index:/shared
    depends_on:
      redis:
        condition: service_healthy

  consumer_service:
    build:
      context: .
      dockerfile: services/consumer_service/Dockerfile
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  vector-index: