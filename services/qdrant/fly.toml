app = "logsage-qdrant"
primary_region = "yyz"

[build]
  image = "qdrant/qdrant:latest"

[env]
  QDRANT__SERVICE__HOST = "::"

[[mounts]]
  source = "qdrant_data"
  destination = "/qdrant/storage"

[[services]]
  internal_port = 6333
  protocol = "tcp"
  [[services.ports]]
    port = 6333

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1