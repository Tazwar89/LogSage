app = "logsage-ingestion"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  VECTOR_BACKEND = "qdrant"
  QDRANT_URL = "http://logsage-qdrant.internal:6333"
  VECTOR_INDEX_PATH = "/shared/index"

[[mounts]]
  source = "vector_index"
  destination = "/shared"

[[services]]
  internal_port = 8001
  protocol = "tcp"
  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1