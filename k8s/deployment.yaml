apiVersion: apps/v1
kind: Deployment
metadata:
  name: logsage
  labels:
    app: logsage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logsage
  template:
    metadata:
      labels:
        app: logsage
    spec:
      containers:
        - name: logsage
          image: logsage:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: logsage-secrets
                  key: groq-api-key
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379