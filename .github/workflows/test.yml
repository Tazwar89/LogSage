name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first — the default PyPI wheel pulls in CUDA/triton,
          # which segfaults on import on a driver-less GitHub-hosted runner
          # (torch.optim.Adam's __init__ now lazily imports torch._dynamo -> triton).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # Each service's tests run in a SEPARATE pytest invocation. All three
      # services define a top-level package literally named `app`, so
      # running them in one combined `pytest tests/` call would cause one
      # service's modules to silently shadow another's (confirmed via
      # direct testing -- whichever service's conftest.py runs first wins,
      # and the second service's real code is never actually tested).
      - name: Run logsage_common tests
        run: pytest tests/logsage_common -v

      - name: Run ingestion_service tests
        run: pytest tests/ingestion_service -v

      - name: Run analysis_service tests
        run: pytest tests/analysis_service -v

      - name: Run consumer_service tests
        run: pytest tests/consumer_service -v

      - name: Run eval tests
        run: pytest eval -v

      - name: Lint (non-blocking)
        run: |
          pip install ruff
          ruff check services/ libs/ eval/ scripts/ --exit-zero