name: Build, Push, and Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image prefix
        # Docker/GHCR requires fully lowercase repository names, but
        # github.repository preserves the actual case of the account name
        # (Tazwar89), which fails the build with "repository name must be
        # lowercase". This computes a lowercase version once and reuses it.
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ingestion_service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ingestion_service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ingestion-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push analysis_service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/analysis_service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/analysis-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push consumer_service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/consumer_service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/consumer-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: docker pull ghcr.io/tazwar89/logsage/base:latest

      - name: Start the full stack
        run: docker compose up -d --build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MOCK_LLM: "true"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Wait for services to be healthy
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8001/health; do sleep 3; done'
          timeout 120 bash -c 'until curl -sf http://localhost:8002/health; do sleep 3; done'

      - name: Run the full curl smoke-test flow
        run: |
          curl -f -X POST http://localhost:8001/upload/baseline -F "file=@services/analysis_service/data/HDFS_2k.log"
          curl -f -X POST http://localhost:8001/upload/logs -F "file=@services/analysis_service/data/test_anomalous.log"
          sleep 5
          curl -f http://localhost:8002/logs
          curl -f http://localhost:8002/analyze/test_anomalous.log-0
          curl -f http://localhost:8002/stats

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v