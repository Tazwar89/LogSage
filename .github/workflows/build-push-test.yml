name: Build, Push, and Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image prefix
        # Docker/GHCR requires fully lowercase repository names, but
        # github.repository preserves the actual case of the account name
        # (Tazwar89), which fails the build with "repository name must be
        # lowercase". This computes a lowercase version once and reuses it.
        run: echo "IMAGE_PREFIX=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ingestion_service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ingestion_service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ingestion_service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push analysis_service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/analysis_service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/analysis_service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push consumer_service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/consumer_service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/consumer_service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: docker pull ghcr.io/tazwar89/logsage/base:latest

      - name: Start the full stack
        run: docker compose up -d --build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MOCK_LLM: "true"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Wait for services to be healthy
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8001/health; do sleep 3; done'
          timeout 120 bash -c 'until curl -sf http://localhost:8002/health; do sleep 3; done'

      - name: Run the full curl smoke-test flow
        run: |
          curl -f -X POST http://localhost:8001/upload/baseline -F "file=@services/analysis_service/data/HDFS_2k.log"
          curl -f -X POST http://localhost:8001/upload/logs -F "file=@services/analysis_service/data/test_anomalous.log"
          sleep 5
          curl -f http://localhost:8002/logs
          curl -f http://localhost:8002/analyze/test_anomalous.log-0
          curl -f http://localhost:8002/stats

      - name: Run analysis load-test script
        run: |
          chmod +x scripts/load_test_analysis.sh
          BASE_URL=http://localhost:8002 ./scripts/load_test_analysis.sh test_anomalous.log 1

      # scripts/anomaly_report.py runs on the runner (not inside a container)
      # because it imports `ingestion_service.app.*`, which only exists as a
      # package in the repo checkout -- inside the ingestion image the same
      # code is packaged as `app.*`. The baseline was already uploaded to the
      # compose Qdrant (port 6333 is published) by the smoke-test step above.
      - name: Set up Python for anomaly report
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install anomaly report dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first, so sentence-transformers doesn't pull the multi-GB CUDA build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r services/ingestion_service/requirements.txt pandas
          pip install -e libs/logsage_common

      - name: Run anomaly report script
        run: python scripts/anomaly_report.py services/analysis_service/data/HDFS_2k.log
        env:
          QDRANT_URL: http://localhost:6333
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Show installed client versions on failure
        if: failure()
        run: |
          docker compose exec -T analysis_service pip list 2>/dev/null | grep -i -E "qdrant|pydantic|sentence" || true
          docker compose images

      - name: Tear down
        if: always()
        run: docker compose down -v