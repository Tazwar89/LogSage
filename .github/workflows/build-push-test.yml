name: Build, Push, and Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Base image first -- the three services depend on it (FROM logsage-base:latest)
      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ingestion_service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ingestion_service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ingestion-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push analysis_service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/analysis_service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/analysis-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push consumer_service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/consumer_service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/consumer-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build base image locally for this runner
        run: docker build -f Dockerfile.base -t logsage-base:latest .

      - name: Start the full stack
        run: docker compose up -d --build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MOCK_LLM: "true"   # avoid spending real API credits on every CI run

      - name: Wait for services to be healthy
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8001/health; do sleep 3; done'
          timeout 120 bash -c 'until curl -sf http://localhost:8002/health; do sleep 3; done'

      - name: Run the full curl smoke-test flow
        run: |
          curl -f -X POST http://localhost:8001/upload/baseline -F "file=@HDFS_2k.log"
          curl -f -X POST http://localhost:8001/upload/logs -F "file=@test.log"
          sleep 5
          curl -f http://localhost:8002/logs
          curl -f http://localhost:8002/analyze/test.log-0
          curl -f http://localhost:8002/stats

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v